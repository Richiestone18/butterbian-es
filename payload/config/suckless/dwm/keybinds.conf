# keybinds.conf — every keybinding, in one file that is yours: once you
# have edited it the installer leaves it alone, and a changed shipped
# version lands beside it as keybinds.conf.new. Edit freely, then
# Super+Escape (scripts/keybinds-apply) regenerates dwm/keys.h, rebuilds
# dwm and restarts it in place, keeping your windows and tags. The bar's
# keybinds popup (Super+/) reads this file.
#
# One bind per line, named fields, any order:
#
#   mod=super+shift  key=b  desc="Browser (private)"  run="firefox-esr -private-window"
#   mod=super        key=q  desc="Close window"       do=killclient
#
#   mod    super, shift, ctrl, alt joined with +; none (or left out) for no modifier
#   key    an X keysym name: a, 1, Return, space, Left, F12, grave (`), minus,
#          equal, comma, period, slash, apostrophe, XF86AudioRaiseVolume…
#   desc   what the help shows; a leading ! pins it to the top of its section.
#          Left out, the help labels the bind from what it does.
#   run    a shell line, run as is
#   do     one of dwm's own actions (below), with its argument after a space
#
# Quote a value with spaces in double quotes. "# --- name ---" starts a
# section of the help; other comments and blank lines are yours.
#
# do= actions, with what they take:
#   killclient  fullscreen  togglefloating  togglesticky  togglefollow
#   togglebar  zoom  resetfacts  togglegaps  defaultgaps
#   viewtoleft  viewtoright  tagtoleft  tagtoright       nothing
#   focusstack next|prev        movestack next|prev
#   incnmaster +1|-1            focusmon next|prev    tagmon next|prev
#   resizefocused +0.05         setmfact 0.55         setcfact +0.25
#   view N  toggleview N  tag N  toggletag N          tag number 1–12
#   view back                   the previously viewed tag
#   setlayout NAME              dwindle tile columns centered floating bstack
#                               nrowgrid deck gaplessgrid spiral monocle grid
#                               bstackhoriz centeredfloating horizgrid
#   incrgaps +1  incrigaps  incrogaps  incrihgaps  incrivgaps
#   incrohgaps  incrovgaps  (+1 / -1)
#   togglescratch ID            a scratchpad defined in rules.conf (its one-letter id)
#   scratchslot N               toggle scratch slot N (tabbed, see scratchtagwins.c)
#   makescratchtagwin N|s|none  put the focused window in slot N / the
#                               scratchpad / clear its scratch state
#   quit                        quit dwm      quit restart   restart in place

# --- lanzar ---
mod=super            key=Return               desc="!Terminal"                             run=kitty
mod=super            key=space                desc="!Lanzador de aplicaciones (la barra; rofi cuando la barra está abajo)" run=~/.config/suckless/scripts/launcher
mod=super            key=b                    desc=Navegador                               run=Brave
mod=super+shift      key=b                    desc="Navegador (ventana privada)"              run="firefox-esr -private-window"
mod=super            key=c                    desc="Navegador Helium"                        run=helium
mod=super+shift      key=c                    desc="Navegador Helium (incógnito)"            run="helium --incognito"
mod=super            key=f                    desc="Gestor de archivos"                          run=thunar
mod=super            key=e                    desc=Editor                                  run=geany
mod=super            key=g                    desc="GIMP (se abre en etiqueta 9)"                                 run=gimp
mod=super            key=d                    desc="Discord (se abre en etiqueta 8)"                              run=Discord
mod=super            key=o                    desc="OBS (se abre en etiqueta 10)"                                  run=obs
mod=super            key=slash                desc="Atajos de teclado"                             run=~/.config/suckless/scripts/help
mod=super            key=Tab                  desc="!Cambiador de ventanas (la barra; rofi cuando la barra está abajo)" run="~/.config/suckless/scripts/launcher windows"

# --- ventanas emergentes de barra ---
mod=super+shift      key=p                    desc="Selector de fondo de pantalla (re-tematiza el escritorio desde la imagen)" run="qs -p ~/.config/suckless/quickshell ipc call settings open wallpaper"
mod=super+shift      key=m                    desc="Menú de comandos"                          run="qs -p ~/.config/suckless/quickshell ipc call commands toggle"
mod=super+shift      key=l                    desc="Configuración de diseño"                       run="qs -p ~/.config/suckless/quickshell ipc call settings open layout"
mod=super+shift      key=n                    desc="Aplicación de red (Super+n es ventana-sigue)" run=~/.config/suckless/scripts/network
mod=super            key=x                    desc="Menú de energía"                            run=~/.config/suckless/scripts/power

# --- ventana ---
mod=super            key=q                    desc="!Cerrar ventana"                         do=killclient
mod=super            key=j                    desc="Enfocar siguiente ventana"                     do="focusstack next"
mod=super            key=k                    desc="Enfocar ventana anterior"                 do="focusstack prev"
mod=super            key=Right                desc="Enfocar siguiente ventana"                     do="focusstack next"
mod=super            key=Left                 desc="Enfocar ventana anterior"                 do="focusstack prev"
mod=super+shift      key=j                    desc="Mover ventana abajo en la pila"            do="movestack next"
mod=super+shift      key=k                    desc="Mover ventana arriba en la pila"              do="movestack prev"
mod=super+shift      key=Right                desc="Mover ventana abajo en la pila"            do="movestack next"
mod=super+shift      key=Left                 desc="Mover ventana arriba en la pila"              do="movestack prev"
mod=super+shift      key=f                    desc="Pantalla completa"                              do=fullscreen
mod=super+shift      key=space                desc="Alternar flotante"                       do=togglefloating
mod=super            key=y                    desc="Anclar (mostrar en todas las etiquetas)"             do=togglesticky
mod=super            key=n                    desc="La ventana sigue en etiqueta / enviar a monitor"  do=togglefollow
mod=super+ctrl       key=b                    desc="Alternar barra nativa"                 do=togglebar
mod=super            key=w                    desc="Pestaña adjuntar: ventana enfocada en un grupo de pestañas en este monitor" run="~/.config/suckless/dwm/dwmtabs attach"
mod=super+shift      key=w                    desc="Pestaña separar: ventana enfocada fuera de su grupo de pestañas" run="~/.config/suckless/dwm/dwmtabs detach"

# --- diseños ---
mod=super            key=h                    desc="!Reducir maestro (o columna)"            do="resizefocused -0.05"
mod=super            key=l                    desc="!Aumentar maestro (o columna)"              do="resizefocused +0.05"
mod=super+ctrl       key=Left                 desc="Reducir maestro (o columna)"             do="resizefocused -0.05"
mod=super+ctrl       key=Right                desc="Aumentar maestro (o columna)"               do="resizefocused +0.05"
mod=super            key=semicolon            desc="Restablecer factores de maestro y columna"       do=resetfacts
mod=super+alt        key=Tab                  desc="Conteo maestro +1"                       do="incnmaster +1"
mod=super+alt+shift  key=Tab                  desc="Conteo maestro -1"                       do="incnmaster -1"
# Diseños
mod=shift+ctrl       key=1                                                                 desc="Diseño: dwindle (cascada)"   do="setlayout dwindle"
mod=shift+ctrl       key=2                                                                 desc="Diseño: mosaico"   do="setlayout tile"
mod=shift+ctrl       key=3                                                                 desc="Diseño: columnas"   do="setlayout columns"
mod=shift+ctrl       key=4                                                                 desc="Diseño: centrada"   do="setlayout centered"
mod=shift+ctrl       key=5                                                                 desc="Diseño: flotante"   do="setlayout floating"
mod=shift+ctrl       key=6                                                                 desc="Diseño: pila inferior"   do="setlayout bstack"
mod=shift+ctrl       key=7                                                                 desc="Diseño: rejilla de n filas"   do="setlayout nrowgrid"
mod=shift+ctrl       key=8                                                                 desc="Diseño: baraja"   do="setlayout deck"
mod=shift+ctrl       key=9                                                                 desc="Diseño: rejilla sin huecos"   do="setlayout gaplessgrid"
mod=shift+ctrl       key=0                                                                 desc="Diseño: espiral"   do="setlayout spiral"
mod=shift+ctrl       key=minus                                                             desc="Diseño: monóculo"   do="setlayout monocle"
mod=shift+ctrl       key=equal                                                             desc="Diseño: rejilla"   do="setlayout grid"

# --- etiquetas ---
mod=super            key=apostrophe           desc="Etiqueta vista previamente"                 do="view back"
# Ver etiqueta
mod=super            key=1                                                                 desc="Ver etiqueta 1"   do="view 1"
mod=super            key=2                                                                 desc="Ver etiqueta 2"   do="view 2"
mod=super            key=3                                                                 desc="Ver etiqueta 3"   do="view 3"
mod=super            key=4                                                                 desc="Ver etiqueta 4"   do="view 4"
mod=super            key=5                                                                 desc="Ver etiqueta 5"   do="view 5"
mod=super            key=6                                                                 desc="Ver etiqueta 6"   do="view 6"
mod=super            key=7                                                                 desc="Ver etiqueta 7"   do="view 7"
mod=super            key=8                                                                 desc="Ver etiqueta 8"   do="view 8"
mod=super            key=9                                                                 desc="Ver etiqueta 9"   do="view 9"
mod=super            key=0                                                                 desc="Ver etiqueta 10"   do="view 10"
mod=super            key=minus                                                             desc="Ver etiqueta 11"   do="view 11"
mod=super            key=equal                                                             desc="Ver etiqueta 12"   do="view 12"
# Enviar ventana a la etiqueta
mod=super+shift      key=1                                                                 desc="Enviar ventana a la etiqueta 1"   do="tag 1"
mod=super+shift      key=2                                                                 desc="Enviar ventana a la etiqueta 2"   do="tag 2"
mod=super+shift      key=3                                                                 desc="Enviar ventana a la etiqueta 3"   do="tag 3"
mod=super+shift      key=4                                                                 desc="Enviar ventana a la etiqueta 4"   do="tag 4"
mod=super+shift      key=5                                                                 desc="Enviar ventana a la etiqueta 5"   do="tag 5"
mod=super+shift      key=6                                                                 desc="Enviar ventana a la etiqueta 6"   do="tag 6"
mod=super+shift      key=7                                                                 desc="Enviar ventana a la etiqueta 7"   do="tag 7"
mod=super+shift      key=8                                                                 desc="Enviar ventana a la etiqueta 8"   do="tag 8"
mod=super+shift      key=9                                                                 desc="Enviar ventana a la etiqueta 9"   do="tag 9"
mod=super+shift      key=0                                                                 desc="Enviar ventana a la etiqueta 10"   do="tag 10"
mod=super+shift      key=minus                                                             desc="Enviar ventana a la etiqueta 11"   do="tag 11"
mod=super+shift      key=equal                                                             desc="Enviar ventana a la etiqueta 12"   do="tag 12"
# Alternar visibilidad de la etiqueta
mod=super+ctrl       key=1                                                                 desc="Alternar vista de la etiqueta 1"   do="toggleview 1"
mod=super+ctrl       key=2                                                                 desc="Alternar vista de la etiqueta 2"   do="toggleview 2"
mod=super+ctrl       key=3                                                                 desc="Alternar vista de la etiqueta 3"   do="toggleview 3"
mod=super+ctrl       key=4                                                                 desc="Alternar vista de la etiqueta 4"   do="toggleview 4"
mod=super+ctrl       key=5                                                                 desc="Alternar vista de la etiqueta 5"   do="toggleview 5"
mod=super+ctrl       key=6                                                                 desc="Alternar vista de la etiqueta 6"   do="toggleview 6"
mod=super+ctrl       key=7                                                                 desc="Alternar vista de la etiqueta 7"   do="toggleview 7"
mod=super+ctrl       key=8                                                                 desc="Alternar vista de la etiqueta 8"   do="toggleview 8"
mod=super+ctrl       key=9                                                                 desc="Alternar vista de la etiqueta 9"   do="toggleview 9"
mod=super+ctrl       key=0                                                                 desc="Alternar vista de la etiqueta 10"   do="toggleview 10"
mod=super+ctrl       key=minus                                                             desc="Alternar vista de la etiqueta 11"   do="toggleview 11"
mod=super+ctrl       key=equal                                                             desc="Alternar vista de la etiqueta 12"   do="toggleview 12"
# Alternar ventana en la etiqueta
mod=super+ctrl+shift key=1                                                                 desc="Alternar ventana en la etiqueta 1"   do="toggletag 1"
mod=super+ctrl+shift key=2                                                                 desc="Alternar ventana en la etiqueta 2"   do="toggletag 2"
mod=super+ctrl+shift key=3                                                                 desc="Alternar ventana en la etiqueta 3"   do="toggletag 3"
mod=super+ctrl+shift key=4                                                                 desc="Alternar ventana en la etiqueta 4"   do="toggletag 4"
mod=super+ctrl+shift key=5                                                                 desc="Alternar ventana en la etiqueta 5"   do="toggletag 5"
mod=super+ctrl+shift key=6                                                                 desc="Alternar ventana en la etiqueta 6"   do="toggletag 6"
mod=super+ctrl+shift key=7                                                                 desc="Alternar ventana en la etiqueta 7"   do="toggletag 7"
mod=super+ctrl+shift key=8                                                                 desc="Alternar ventana en la etiqueta 8"   do="toggletag 8"
mod=super+ctrl+shift key=9                                                                 desc="Alternar ventana en la etiqueta 9"   do="toggletag 9"
mod=super+ctrl+shift key=0                                                                 desc="Alternar ventana en la etiqueta 10"   do="toggletag 10"
mod=super+ctrl+shift key=minus                                                             desc="Alternar ventana en la etiqueta 11"   do="toggletag 11"
mod=super+ctrl+shift key=equal                                                             desc="Alternar ventana en la etiqueta 12"   do="toggletag 12"
mod=ctrl+shift       key=Left                 desc="Etiqueta anterior"                          do=viewtoleft
mod=ctrl+shift       key=Right                desc="Siguiente etiqueta"                              do=viewtoright
mod=alt+ctrl         key=Left                 desc="Enviar ventana a etiqueta anterior"           do=tagtoleft
mod=alt+ctrl         key=Right                desc="Enviar ventana a siguiente etiqueta"               do=tagtoright

# --- monitor ---
mod=super            key=comma                desc="Enfocar monitor anterior"                do="focusmon prev"
mod=super            key=period               desc="Enfocar siguiente monitor"                    do="focusmon next"
mod=super+shift      key=comma                desc="Enviar ventana a monitor anterior"       do="tagmon prev"
mod=super+shift      key=period               desc="Enviar ventana a siguiente monitor"           do="tagmon next"

# --- scratchpads ---
mod=super            key=grave                desc="!Terminal desplegable"                   do="togglescratch s"
mod=super            key=v                    desc=Pulsemixer                              do="togglescratch a"

# --- ranuras scratch ---
# Nine numbered slots (the scratchtagwins patch): put any window in a
# slot, then show or hide it with its number, like a scratchpad you
# make on the spot. The drop-down terminal is slot "s".
# Show or hide slot 1–9
mod=super+alt        key=1                                                                 desc="Mostrar/ocultar ranura 1"   do="scratchslot 1"
mod=super+alt        key=2                                                                 desc="Mostrar/ocultar ranura 2"   do="scratchslot 2"
mod=super+alt        key=3                                                                 desc="Mostrar/ocultar ranura 3"   do="scratchslot 3"
mod=super+alt        key=4                                                                 desc="Mostrar/ocultar ranura 4"   do="scratchslot 4"
mod=super+alt        key=5                                                                 desc="Mostrar/ocultar ranura 5"   do="scratchslot 5"
mod=super+alt        key=6                                                                 desc="Mostrar/ocultar ranura 6"   do="scratchslot 6"
mod=super+alt        key=7                                                                 desc="Mostrar/ocultar ranura 7"   do="scratchslot 7"
mod=super+alt        key=8                                                                 desc="Mostrar/ocultar ranura 8"   do="scratchslot 8"
mod=super+alt        key=9                                                                 desc="Mostrar/ocultar ranura 9"   do="scratchslot 9"
# Put this window in slot 1–9
mod=super+alt+shift  key=1                                                                 desc="Poner esta ventana en la ranura 1"   do="makescratchtagwin 1"
mod=super+alt+shift  key=2                                                                 desc="Poner esta ventana en la ranura 2"   do="makescratchtagwin 2"
mod=super+alt+shift  key=3                                                                 desc="Poner esta ventana en la ranura 3"   do="makescratchtagwin 3"
mod=super+alt+shift  key=4                                                                 desc="Poner esta ventana en la ranura 4"   do="makescratchtagwin 4"
mod=super+alt+shift  key=5                                                                 desc="Poner esta ventana en la ranura 5"   do="makescratchtagwin 5"
mod=super+alt+shift  key=6                                                                 desc="Poner esta ventana en la ranura 6"   do="makescratchtagwin 6"
mod=super+alt+shift  key=7                                                                 desc="Poner esta ventana en la ranura 7"   do="makescratchtagwin 7"
mod=super+alt+shift  key=8                                                                 desc="Poner esta ventana en la ranura 8"   do="makescratchtagwin 8"
mod=super+alt+shift  key=9                                                                 desc="Poner esta ventana en la ranura 9"   do="makescratchtagwin 9"
# Promote focused window to the drop-down scratchpad
mod=super+alt+shift  key=s                    desc="Hacer que esta ventana sea la terminal desplegable" do="makescratchtagwin s"
# Clear scratch state on the focused window
mod=super+alt+shift  key=grave                desc="Sacar esta ventana de su ranura" do="makescratchtagwin none"

# --- huecos ---
mod=super+alt        key=0                    desc="!Alternar huecos"                          do=togglegaps
mod=super+alt+shift  key=0                    desc="Restablecer huecos a valores predeterminados"                do=defaultgaps
mod=super+alt        key=u                    desc="Todos los huecos +1"                           do="incrgaps +1"
mod=super+alt+shift  key=u                    desc="Todos los huecos -1"                           do="incrgaps -1"
mod=super+alt        key=i                    desc="Huecos internos +1"                         do="incrigaps +1"
mod=super+alt+shift  key=i                    desc="Huecos internos -1"                         do="incrigaps -1"
mod=super+alt        key=o                    desc="Huecos externos +1"                         do="incrogaps +1"
mod=super+alt+shift  key=o                    desc="Huecos externos -1"                         do="incrogaps -1"
# one axis at a time: h/l horizontal, j/k vertical; inner on h/j, outer on l/k
mod=super+alt        key=h                    desc="Huecos internos horizontales +1"              do="incrihgaps +1"
mod=super+alt+shift  key=h                    desc="Huecos internos horizontales -1"              do="incrihgaps -1"
mod=super+alt        key=j                    desc="Huecos internos verticales +1"                do="incrivgaps +1"
mod=super+alt+shift  key=j                    desc="Huecos internos verticales -1"                do="incrivgaps -1"
mod=super+alt        key=l                    desc="Huecos externos horizontales +1"              do="incrohgaps +1"
mod=super+alt+shift  key=l                    desc="Huecos externos horizontales -1"              do="incrohgaps -1"
mod=super+alt        key=k                    desc="Huecos externos verticales +1"                do="incrovgaps +1"
mod=super+alt+shift  key=k                    desc="Huecos externos verticales -1"                do="incrovgaps -1"

# --- medios ---
mod=super            key=F12                  desc="Volumen arriba"                             run="~/.config/suckless/scripts/changevolume up"
mod=super            key=F11                  desc="Volumen abajo"                           run="~/.config/suckless/scripts/changevolume down"
mod=super            key=F10                  desc="Silenciar"                                  run="~/.config/suckless/scripts/changevolume mute"
mod=none             key=XF86AudioRaiseVolume desc="Volumen arriba"                             run="~/.config/suckless/scripts/changevolume up"
mod=none             key=XF86AudioLowerVolume desc="Volumen abajo"                           run="~/.config/suckless/scripts/changevolume down"
mod=none             key=XF86AudioMute        desc="Silenciar"                                  run="~/.config/suckless/scripts/changevolume mute"
mod=none             key=XF86MonBrightnessUp  desc="Brillo arriba"                         run="xbacklight +10"
mod=none             key=XF86MonBrightnessDown desc="Brillo abajo"                       run="xbacklight -10"

# --- capturas ---
mod=super+shift      key=s                    desc="Captura: región (editor de flameshot)" run="~/.config/suckless/scripts/screenshot region"
mod=super            key=s                    desc="Captura: pantalla completa"               run="~/.config/suckless/scripts/screenshot full"

# --- sistema ---
mod=super            key=Escape               desc="!Aplicar este archivo: regenerar, reconstruir y reiniciar dwm en su lugar" run=~/.config/suckless/scripts/keybinds-apply
mod=super+shift      key=r                    desc="Reiniciar dwm (mantiene ventanas y etiquetas)"  do="quit restart"
mod=super+ctrl       key=r                    desc="Reiniciar la barra"                       run="~/.config/suckless/scripts/bar restart"
mod=super+shift      key=q                    desc="Salir de dwm"                              do=quit
